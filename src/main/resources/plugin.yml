name: GameCoordinator
version: '1.0.3-SNAPSHOT'
main: net.afterbloom.gameCoordinator.GameCoordinator
api-version: '1.21'
prefix: GameCoordinator
load: STARTUP
authors: [ErrinDev]
description: GameCoordinator for AfterBloom MC Minigames
website: https://www.afterbloom.net
softdepend: [PlaceholderAPI]
libraries:
  - redis.clients:jedis:6.1.0
  - com.google.code.gson:gson:2.11.0
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.3.0
commands:
  coordinator:
    description: Manage the GameCoordinator
    usage: /coordinator <help|testpub|testsub>
    permission: minigames.manage
    permission-message: You do not have permission to use this command.

  minigame:
    description: Join and manage minigames
    usage: /minigame <list|join>
    aliases: [game, minigames]

  report:
    description: Report a player
    usage: /report [player] [reason]

  follow-player:
    description: Follow a player to their server in vanish
    usage: /follow-player [player]
    permission: minigames.staff.follow

  find:
    description: Find a player on the network
    usage: /find [player]
    permission: minigames.staff.find

  mgtp:
    description: Teleport to a player on the network in vanish
    usage: /mgtp [player]
    permission: minigames.staff

  staffmode:
    description: Toggle staff mode (vanish + spectator)
    usage: /staffmode
    permission: minigames.staff